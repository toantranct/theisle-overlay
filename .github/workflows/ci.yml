name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Svelte/TypeScript check
        run: npm run check

      - name: Frontend build
        run: npm run build

      - name: Forbidden Win32 API tripwire
        shell: pwsh
        run: ./scripts/check-forbidden-apis.ps1

      # Load-bearing since telemetry: the release workflow derives the signing
      # key from package.json's version and the app sends Cargo.toml's, so a
      # drift means every request from that release is rejected.
      - name: Version consistency
        shell: pwsh
        run: ./scripts/check-versions.ps1

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --workspace

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace -- -D warnings

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install
        working-directory: worker
        run: npm ci
      - name: Typecheck
        working-directory: worker
        run: npm run typecheck
