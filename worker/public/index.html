<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TheIsle Overlay — Analytics</title>
<style>
  :root {
    --bg:#0e1116; --panel:#161b22; --line:#242b36; --fg:#e6edf3; --dim:#8b949e;
    --accent:#3b82f6; --warn:#f59e0b; --good:#22c55e;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f8fa; --panel:#fff; --line:#d8dee4; --fg:#1f2328; --dim:#656d76; }
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif }
  header { display:flex; gap:12px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line) }
  h1 { font-size:15px; margin:0; font-weight:600 }
  .sp { flex:1 }
  input, select, button { font:inherit; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 9px }
  button { cursor:pointer }
  button:hover { border-color:var(--accent) }
  main { padding:20px; display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); max-width:1600px }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; min-width:0 }
  section h2 { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); margin:0 0 12px }
  .wide { grid-column:1/-1 }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:12px }
  .kpi b { display:block; font-size:26px; font-weight:600; font-variant-numeric:tabular-nums }
  .kpi span { color:var(--dim); font-size:12px }
  .kpi small { color:var(--dim); font-size:11px; display:block }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums }
  td { padding:3px 0; vertical-align:middle }
  td.n { text-align:right; width:76px; color:var(--dim) }
  td.l { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px }
  .bar { height:8px; border-radius:4px; background:var(--accent); min-width:2px }
  .bar.f { background:var(--good) }
  .scroll { overflow:auto; max-height:420px }
  pre { margin:4px 0 0; font-size:11px; color:var(--dim); white-space:pre-wrap; word-break:break-all; max-height:120px; overflow:auto }
  .item { border-top:1px solid var(--line); padding:9px 0 }
  .item:first-child { border-top:0 }
  .meta { color:var(--dim); font-size:11px; display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  .tag { border:1px solid var(--line); border-radius:99px; padding:0 7px; font-size:11px }
  .new { color:var(--warn); border-color:var(--warn) }
  #msg { padding:20px; color:var(--dim) }
  .note { color:var(--dim); font-size:11px; margin-top:8px }
</style>
</head>
<body>
<header>
  <h1>TheIsle Overlay — Analytics</h1>
  <span class="tag" id="env">—</span>
  <div class="sp"></div>
  <select id="days">
    <option value="14">14 ngày</option>
    <option value="30" selected>30 ngày</option>
    <option value="90">90 ngày</option>
  </select>
  <button id="reload">Tải lại</button>
  <button id="logout">Đổi token</button>
</header>
<div id="msg">Đang tải…</div>
<main id="app" hidden></main>

<script>
const $ = (id) => document.getElementById(id);
const KEY = "isle_admin_token";
const fmt = (n) => (n == null ? "—" : Number(n).toLocaleString("vi-VN"));

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}

function token() {
  let t = localStorage.getItem(KEY);
  if (!t) {
    t = prompt("Admin token:") || "";
    if (t) localStorage.setItem(KEY, t);
  }
  return t;
}

function bars(rows, cls, total) {
  if (!rows || !rows.length) return "<div class='note'>Chưa có dữ liệu.</div>";
  const max = Math.max(...rows.map((r) => Number(r.value) || 0), 1);
  const html = rows.map((r) => {
    const v = Number(r.value) || 0;
    const pct = total ? " (" + ((v / total) * 100).toFixed(0) + "%)" : "";
    return "<tr><td class='l' title='" + esc(r.dim) + "'>" + esc(r.dim) + "</td>" +
      "<td><div class='bar " + (cls || "") + "' style='width:" + (v / max) * 100 + "%'></div></td>" +
      "<td class='n'>" + fmt(v) + pct + "</td></tr>";
  }).join("");
  return "<table>" + html + "</table>";
}

// Inline SVG, no chart library. A CDN script would be one more origin to
// trust on a page that displays private numbers, and one more thing that can
// break long after anyone remembers why it was there.
function spark(series, metric, days, today) {
  const byDay = new Map(series.filter((r) => r.metric === metric).map((r) => [r.utc_day, r.value]));
  const pts = [];
  for (let d = today - days; d <= today; d++) pts.push(Number(byDay.get(d) ?? 0));
  const max = Math.max(...pts, 1);
  const w = 100, h = 30;
  const path = pts.map((v, i) => ((i / (pts.length - 1)) * w) + "," + (h - (v / max) * h)).join(" ");
  return "<svg viewBox='0 0 " + w + " " + h + "' preserveAspectRatio='none' style='width:100%;height:56px'>" +
    "<polyline fill='none' stroke='var(--accent)' stroke-width='1.2' vector-effect='non-scaling-stroke' points='" + path + "'/></svg>" +
    "<div class='note'>Cao nhất " + fmt(max) + " · gần nhất " + fmt(pts[pts.length - 1]) + "</div>";
}

async function load() {
  const t = token();
  if (!t) { $("msg").textContent = "Cần token."; return; }
  $("msg").textContent = "Đang tải…";
  $("app").hidden = true;
  let r;
  try {
    r = await fetch("/admin/data?days=" + $("days").value, { headers: { authorization: "Bearer " + t } });
  } catch (e) {
    $("msg").textContent = "Không kết nối được: " + e.message;
    return;
  }
  if (r.status === 401) {
    localStorage.removeItem(KEY);
    $("msg").textContent = "Token sai. Tải lại trang để nhập lại.";
    return;
  }
  if (!r.ok) { $("msg").textContent = "Lỗi HTTP " + r.status; return; }
  render(await r.json());
}

function render(d) {
  const s = d.summary || {};
  $("env").textContent = d.build_env || "?";
  const featTotal = (d.features || []).reduce((a, b) => a + (Number(b.value) || 0), 0);

  const crashes = (d.crashes || []).length
    ? (d.crashes || []).map((c) =>
        "<div class='item'><div><b>" + esc(c.sample_msg) + "</b></div>" +
        "<div class='meta'><span class='tag'>" + esc(c.app_version) + "</span>" +
        "<span>" + fmt(c.occurrences) + " lần</span>" +
        "<span>" + esc(String(c.fingerprint).slice(0, 12)) + "</span></div>" +
        (c.sample_stack ? "<pre>" + esc(c.sample_stack) + "</pre>" : "") + "</div>").join("")
    : "<div class='note'>Không có crash nào. Tốt.</div>";

  const feedback = (d.feedback || []).length
    ? (d.feedback || []).map((f) =>
        "<div class='item'><div class='meta'>" +
        "<span class='tag " + (f.status === "new" ? "new" : "") + "'>" + esc(f.category) + "</span>" +
        "<span class='tag'>" + esc(f.app_version) + "</span>" +
        "<span>" + new Date(f.ts_server * 1000).toLocaleString("vi-VN") + "</span>" +
        "<span>" + esc(f.country || "?") + "</span>" +
        (f.contact ? "<span>" + esc(f.contact) + "</span>" : "") +
        (f.status === "new" ? "<button data-read='" + esc(f.id) + "'>Đã đọc</button>" : "") +
        "</div><div>" + esc(f.body) + "</div></div>").join("")
    : "<div class='note'>Chưa có feedback.</div>";

  $("app").innerHTML =
    "<section class='wide'><h2>Tổng quan</h2><div class='kpis'>" +
      "<div class='kpi'><b>" + fmt(s.dau) + "</b><span>DAU</span></div>" +
      "<div class='kpi'><b>" + fmt(s.wau) + "</b><span>WAU</span></div>" +
      "<div class='kpi'><b>" + fmt(s.mau) + "</b><span>MAU</span></div>" +
      "<div class='kpi'><b>" + fmt(s.returning_users) + "</b><span>Người dùng thật</span><small>đã mở ≥ 3 ngày</small></div>" +
      "<div class='kpi'><b>" + fmt(s.new_today) + "</b><span>Cài mới hôm nay</span></div>" +
      "<div class='kpi'><b>" + fmt(s.installs) + "</b><span>Tổng cài đặt</span><small>phồng: VM, cài lại</small></div>" +
      "<div class='kpi'><b>" + fmt(s.launches_window) + "</b><span>Lượt mở " + d.days + " ngày</span><small>từ rollup</small></div>" +
    "</div><div class='note'>“Tổng cài đặt” luôn cao hơn số người thật — cài lại Windows, máy ảo và cloud gaming đều sinh id mới. Con số đáng tin là <b>Người dùng thật</b>.</div></section>" +

    "<section><h2>DAU " + d.days + " ngày</h2>" + spark(d.series || [], "dau", d.days, d.today) + "</section>" +
    "<section><h2>Cài mới " + d.days + " ngày</h2>" + spark(d.series || [], "new", d.days, d.today) + "</section>" +

    "<section><h2>Tính năng " + (d.features_live ? "· 7 ngày · trực tiếp" : "· từ rollup, trễ 1 ngày") + "</h2>" +
      bars(d.features, "f", featTotal) +
      "<div class='note'>Cột thấp = ít ai dùng. Cột cao = chỗ đáng bỏ công tối ưu.</div></section>" +

    "<section><h2>Version (7 ngày)</h2>" + bars(d.versions, "", Number(s.wau) || 0) +
      "<div class='note'>Theo dõi tốc độ hấp thụ bản mới sau khi release.</div></section>" +
    "<section><h2>Windows build (7 ngày)</h2>" + bars(d.os) + "</section>" +
    "<section><h2>Quốc gia (7 ngày)</h2>" + bars(d.country) + "</section>" +
    "<section><h2>Ngôn ngữ máy (7 ngày)</h2>" + bars(d.locale) + "</section>" +

    "<section class='wide'><h2>Crash (14 ngày)</h2><div class='scroll'>" + crashes + "</div></section>" +
    "<section class='wide'><h2>Feedback</h2><div class='scroll'>" + feedback + "</div></section>";

  $("app").hidden = false;
  $("msg").textContent = "";
  for (const b of document.querySelectorAll("[data-read]")) {
    b.onclick = async () => {
      await fetch("/admin/feedback/read?id=" + encodeURIComponent(b.dataset.read), {
        method: "POST",
        headers: { authorization: "Bearer " + localStorage.getItem(KEY) },
      });
      load();
    };
  }
}

$("reload").onclick = load;
$("days").onchange = load;
$("logout").onclick = () => { localStorage.removeItem(KEY); location.reload(); };
load();
</script>
</body>
</html>
